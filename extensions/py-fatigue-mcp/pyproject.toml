[project]
name = "py-fatigue-mcp"
version = "0.1.1"
description = "Local MCP tools for Py-Fatigue v3"
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=2.3,<3",
    "numpy>=1.24",
    "py-fatigue>=3.0,<4",
    "pydantic>=2.12,<3",
]

[project.urls]
Repository = "https://github.com/OWI-Lab/py_fatigue"
Documentation = "https://github.com/OWI-Lab/py_fatigue/blob/develop/docs/user/mcp.md"

[project.scripts]
py-fatigue-mcp = "py_fatigue_mcp.server:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv.sources]
py-fatigue = { path = "../.." }

[tool.pytest.ini_options]
testpaths = ["tests"]
