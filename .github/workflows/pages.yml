name: Documentation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified develop snapshot to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install the project
        run: uv sync --group dev --group docs
      - name: Build Zensical and export the notebook
        env:
          MPLBACKEND: Agg
        run: uv run invoke docs.build
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: _build/docs
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/develop'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: documentation
          path: site
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
