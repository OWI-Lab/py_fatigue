name: Documentation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a final release from develop or a release candidate from its tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    outputs:
      directory: ${{ steps.publication.outputs.directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the publication ref and choose its Pages path
        id: publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        run: |
          version=$(cat VERSION)
          if [[ "$GITHUB_REF" == refs/heads/develop && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "directory=" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == "refs/tags/v$version" && "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
            git merge-base --is-ancestor HEAD origin/develop
            directory="${BASH_REMATCH[1]}rc${BASH_REMATCH[2]}"
            echo "directory=$directory" >> "$GITHUB_OUTPUT"
            sed -i "/^site_url = /s|\"$|$directory/\"|" zensical.toml
          else
            echo "Select develop for a final release or the matching vVERSION tag for a release candidate."
            exit 1
          fi
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install the project
        run: uv sync --group dev --group docs
      - name: Build Zensical from docs and export the example notebooks
        env:
          MPLBACKEND: Agg
        run: uv run invoke docs.build
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: _build/docs
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: documentation
          path: site
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          destination_dir: ${{ needs.docs.outputs.directory }}
