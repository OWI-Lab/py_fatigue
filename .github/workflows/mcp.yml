name: PyPI token connection check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: pypi-mcp
    steps:
      - name: Check PyPI authentication without uploading a file
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          token = os.environ["UV_PUBLISH_TOKEN"]
          if not token:
              raise SystemExit("PYPI_API_TOKEN is unavailable.")
          authorization = base64.b64encode(f"__token__:{token}".encode()).decode()

          def probe(headers):
              # Use an unsupported protocol and send no file or version fields.
              request = Request(
                  "https://upload.pypi.org/legacy/",
                  data=b"%3Aaction=file_upload&protocol_version=0",
                  headers=headers,
              )
              try:
                  with urlopen(request, timeout=15) as response:
                      return response.status
              except HTTPError as error:
                  return error.code

          anonymous = probe({})
          authenticated = probe({"Authorization": f"Basic {authorization}"})
          print(f"PyPI upload endpoint without credentials: HTTP {anonymous}")
          print(f"PyPI upload endpoint with repository token: HTTP {authenticated}")
          if anonymous != 403 or authenticated != 400:
              raise SystemExit("The PyPI response did not confirm authentication.")
          print("PyPI accepted the token and rejected the deliberately invalid request.")
          PY
