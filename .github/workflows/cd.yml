name: Build and release distributions

on:
  pull_request:
    paths:
      - 'Cargo.*'
      - 'rust/**'
      - 'py_fatigue/**'
      - 'pyproject.toml'
      - 'tests/**'
      - 'scripts/smoke_wheel.py'
      - '.github/workflows/cd.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Select a registry for a tag already merged into develop
        type: choice
        options: [none, testpypi, pypi]
        default: none
      staged_run:
        description: Successful TestPyPI workflow run ID for PyPI promotion
        type: string
        default: ''

permissions:
  contents: read

jobs:
  wheels:
    if: github.event_name == 'pull_request' || inputs.publish != 'pypi'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS: native
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    if: github.event_name == 'pull_request' || inputs.publish != 'pypi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.15'
      - name: Build and verify the sdist
        run: |
          rustup toolchain install stable --profile minimal
          uv build --sdist --out-dir dist
          if tar -tzf dist/*.tar.gz | grep -E '^[^/]+/data/' > /dev/null; then
            echo "Source distribution includes excluded local reference data"
            exit 1
          fi
          uv venv "$RUNNER_TEMP/sdist-check"
          uv pip install --python "$RUNNER_TEMP/sdist-check/bin/python" dist/*.tar.gz
          "$RUNNER_TEMP/sdist-check/bin/python" scripts/smoke_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.publish == 'testpypi'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the release commit and version tag
        run: |
          git merge-base --is-ancestor HEAD origin/develop
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@v5
      - name: Publish to TestPyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TEST_API_TOKEN }}
        run: uv publish --publish-url https://test.pypi.org/legacy/ dist/*
  promote:
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.publish == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the staged run and release tag
        env:
          GH_TOKEN: ${{ github.token }}
          STAGED_RUN: ${{ inputs.staged_run }}
        run: |
          git merge-base --is-ancestor HEAD origin/develop
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          [[ "$STAGED_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGED_RUN" |
            jq -e --arg revision "$(git rev-parse HEAD)" '
              .conclusion == "success" and .head_sha == $revision
              and .path == ".github/workflows/cd.yml"
            '
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGED_RUN/jobs" \
            --jq '.jobs[].steps[] | select(.name == "Publish to TestPyPI") | .conclusion' \
            | grep -Fx success
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
          run-id: ${{ inputs.staged_run }}
          github-token: ${{ github.token }}
      - uses: astral-sh/setup-uv@v5
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish dist/*
