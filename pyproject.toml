[tool.black]
line-length = 80 # Code length, not docstrings

[project]
name = "py_fatigue"
version = "3.0.1"
description = "Py-fatigue bundles the main functionality for performing cyclic stress (fatigue) analysis and cycle-counting."
authors = [
    {name = "Pietro D'Antuono", email = "pietro.dantuono@vub.be"},
    {name = "Wout Weijtjens", email = "wout.weijtjens@vub.be"}
]
classifiers=["Development Status :: 5 - Production/Stable",
             "Environment :: Console",
             "Intended Audience :: Science/Research",
             "Intended Audience :: Information Technology",
             "Natural Language :: English",
             "Operating System :: POSIX :: Linux",
             "Programming Language :: Python :: 3",
             "Programming Language :: Python :: 3.10",
             "Programming Language :: Python :: 3.11",
             "Programming Language :: Python :: 3.12",
             "Programming Language :: Python :: 3.13",
             "Programming Language :: Python :: 3.14",
             "Programming Language :: Python :: 3.15",
             "Topic :: Database"]
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
requires-python = ">=3.10,<3.16"

dependencies = [
    "numpy>=1.24",
    "pyecharts>=2.1",
    "pandas>2.2",
    "matplotlib",
    "pydantic<3.0.0",
]

[dependency-groups]
dev = [
    "gitchangelog~=3.0.4",
    "pytest>=6.2.4",
    "black",
    "flake8~=7.1.2",
    "pylint~=3.3.0",
    "mypy==1.11.2",
    "pyinstrument>=4.0",
    "pytest-cov>=2.12",
    "coverage>=6.5",
    "invoke>=1.5",
    "hypothesis>=6.14.0",
    "marimo; python_version >= '3.11'",
    "rich>=13.9.4",
    "rich-argparse>=1.8.0",
    "jsbeautifier>=1.15.4",
]
docs = [
    "zensical>=0.0.66; python_version >= '3.11'",
    "mkdocstrings[python]; python_version >= '3.11'",
    "marimo; python_version >= '3.11'",
]

[project.urls]
homepage = "https://github.com/owi-lab/py_fatigue"
documentation = "https://owi-lab.github.io/py_fatigue"
"Change Log" = "https://owi-lab.github.io/py_fatigue/changelog.html"
"Bug Tracker" = "https://github.com/owi-lab/py_fatigue/issues"
"Organisation Homepage" = "https://www.owi-lab.be/"

[tool.pytest.ini_options]
markers = [
    "success",
    "error"
]
testpaths = [
    "tests"
]

[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "py_fatigue._rust"
python-source = "."
features = ["python"]
exclude = ["data/**", "_build/**", "**/__marimo__/**", "uv.lock"]

[tool.uv]
package = true
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust/**/*.rs" },
]
default-groups = ["dev", "docs"]

[tool.cibuildwheel]
build = "cp3{10,11,12,13,14,15}-*"
skip = "*-musllinux_* *t-*"
test-command = 'python "{project}/scripts/smoke_wheel.py"'

[tool.cibuildwheel.linux]
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment-pass = ["RUSTUP_HOME", "CARGO_HOME"]
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.12" }
