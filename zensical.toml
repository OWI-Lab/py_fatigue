[project]
site_name = "Py-Fatigue"
site_url = "https://owi-lab.github.io/py_fatigue/"
repo_url = "https://github.com/OWI-Lab/py_fatigue"
repo_name = "OWI-Lab/py_fatigue"
copyright = '© OWI-Lab · <a href="https://github.com/OWI-Lab/py_fatigue/blob/develop/LICENSE">License</a>'
docs_dir = "docs"
site_dir = "_build/docs"
use_directory_urls = false
extra_css = ["stylesheets/documentation.css"]
extra_javascript = [
  "_static/js/custom.js",
  "_static/js/geometric-docs.js",
  "https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-mml-chtml.js",
]
exclude_docs = """
_static/css/
user/mcp.md
*.xcf
"""

nav = [
  { Home = "index.md" },
  { "Getting started" = "user/01-absolute-noob.md" },
  { "Python guide" = [
    "user/02-user-guide.md",
    { "Examples" = [
      "user/examples/01-sn-curves.md",
      "user/examples/02-crack-growth-curves.md",
      "user/examples/03-count-stress-cycles.md",
      "user/examples/04-combine-cycle-counts.md",
      "user/examples/05-correct-for-mean-stress.md",
      "user/examples/06-stress-life-damage.md",
      "user/examples/07-ordered-crack-growth.md",
      "user/examples/08-example-notebooks.md",
    ] },
    { "Upgrading" = ["user/migrate-v3.md"] },
    { "Background" = [
      "user/additional/01-index.md",
      "user/additional/glossary.md",
      "user/additional/02-rainflow-and-residuals.md",
      "user/additional/03-understand-ordered-crack-growth.md",
      "user/additional/relevant_guidelines.md",
    ] },
  ] },
  { MCP = [
    "mcp/01-overview.md",
    { Setup = ["mcp/02-run-locally.md", "mcp/03-connect-hosted.md"] },
    { Examples = [
      "mcp/04-analyze-stress-history.md",
      "mcp/05-analyze-local-csv.md",
      "mcp/06-recover-lffd.md",
      "mcp/07-propagate-sc07.md",
    ] },
    "mcp/08-tool-reference.md",
  ] },
  { "API reference" = [
    "api/01-index.md",
    { "Cycle count" = [
      { CycleCount = "api/cycle_count/cycle_count_.md" },
      { Histograms = "api/cycle_count/histogram.md" },
      { Rainflow = "api/cycle_count/rainflow.md" },
      { Helpers = "api/cycle_count/utils.md" },
    ] },
    { "Material" = [
      { "S–N curves" = "api/material/sn_curve.md" },
      { "Crack growth curves" = "api/material/crack_growth_curve.md" },
    ] },
    { "Geometry" = [
      { "Generic geometries" = "api/geometry/generic.md" },
      { Cylinders = "api/geometry/cylinder.md" },
    ] },
    { "Stress" = [
      { "Stress ranges" = "api/stress/stress_range.md" },
      { "Mean stress" = "api/stress/mean_stress.md" },
    ] },
    { "Damage" = [
      { "Stress-life damage" = "api/damage/stress_life.md" },
      { "Cycle-counted crack growth" = "api/damage/crack_growth.md" },
      { "Ordered crack growth" = "api/damage/ordered_crack_growth.md" },
    ] },
    { "Plot styling" = "api/styling.md" },
    { "Synthetic signals" = "api/testing.md" },
    { Utilities = "api/utils.md" },
  ] },
  { Development = ["development.md", "architecture.md", "architecture-proposal.md"] },
  { Changelog = "changelog.md" },
]

[project.theme]
variant = "modern"
font.text = "IBM Plex Sans"
font.code = "IBM Plex Mono"
favicon = "_static/_img/py-fatigue-logomark-light-theme.svg"
logo = "_static/_img/py-fatigue-logomark-light-theme.svg"
language = "en"
features = [
  "navigation.tracking",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "toc.follow",
  "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/monitor"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Follow system theme"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/py-fatigue/"
name = "Py-Fatigue on PyPI"

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.tables]

[project.markdown_extensions.def_list]

[project.markdown_extensions.admonition]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
docstring_section_style = "table"
show_source = true
show_root_heading = true
show_category_heading = true
separate_signature = true
signature_crossrefs = true
