      <g transform="translate(3861.789038 0)"><path d="M111 500 V183 C111 73 170 20 270 20 C365 20 440 70 489 149 M489 500 V0"/></g>
      <g transform="translate(4382.289038 0)"><path d="M102 265 H491 C491 397 413 480 301 480 C180 480 101 384 101 250 C101 113 183 20 310 20 C383 20 444 47 488 94"/></g>
  </g>
</svg>
