<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 823 153" role="img" aria-labelledby="title desc">
  <title id="title">py_fatigue — dark theme logo</title>
  <desc id="desc">Slate-grey fracture monogram and custom, regular-weight monospaced vector lettering inspired by the supplied reference. The outer border is 90% of the letter weight, with a pronounced transparent clearance and three distinct grey fills, and the visible logo-to-text gap is one nominal character cell.</desc>
  <!-- Monogram: matched f-height, 90% of the letter stem weight, pronounced transparent clearance and three slate-grey fragments; its top aligns with the p. -->
  <g transform="translate(13.271071 39.703857) scale(0.194535714)">
<defs>
    <path id="monogram" fill-rule="evenodd" d="
      M178 32 H301
      C396 32 470 93 470 178
      C470 261 399 324 310 324
      V346 Q310 372 285 372
      H194 V456 Q194 480 170 480
      H111 Q87 480 87 456
      V372 H50 Q26 372 26 348
      V320 Q26 296 50 296
      H87 V128 C87 72 123 32 178 32 Z
      M194 144 Q194 132 206 132
      H300 C338 132 366 151 366 178
      C366 205 338 226 300 226
      H194 Z"/>
    <path id="fractures" d="
      M309 13 L290 32 L245 78 L259 94 L229 132 L215 148
      M215 211 V289 L239 305 L270 289 L310 324 L323 336
      M349 170 L394 151 L414 168 L490 132"/>
    <clipPath id="inside">
      <path clip-rule="evenodd" d="
        M178 32 H301
        C396 32 470 93 470 178
        C470 261 399 324 310 324
        V346 Q310 372 285 372
        H194 V456 Q194 480 170 480
        H111 Q87 480 87 456
        V372 H50 Q26 372 26 348
        V320 Q26 296 50 296
        H87 V128 C87 72 123 32 178 32 Z
        M194 144 Q194 132 206 132
        H300 C338 132 366 151 366 178
        C366 205 338 226 300 226
        H194 Z"/>
    </clipPath>
    <mask id="exclude-bowl" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#FFF"/>
      <path fill="#000" d="M309 13 L290 32 L245 78 L259 94 L229 132
L215 148 V289 L239 305 L270 289 L310 324
L323 336 H512 V0 H309 Z"/>
    </mask>
    <!-- Remove a clearance around the outline and both sides of each fracture. -->
    <mask id="fill-inset" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#FFF"/>
      <use href="#monogram" fill="none" stroke="#000" stroke-width="65.067744" stroke-linejoin="round"/>
      <use href="#fractures" fill="none" stroke="#000" stroke-width="69.614283" stroke-linejoin="round" stroke-linecap="round"/>
    </mask>
    <!-- A true transparent cut through the outlines. -->
    <mask id="open-fractures" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#FFF"/>
      <use href="#fractures" fill="none" stroke="#000" stroke-width="9.889618" stroke-linejoin="round" stroke-linecap="round"/>
    </mask>
  <clipPath id="bowl-region"><path d="
      M309 13 L290 32 L245 78 L259 94 L229 132
      L215 148 V289 L239 305 L270 289 L310 324
      L323 336 H512 V0 H309 Z"/></clipPath>
  </defs>
  <g clip-path="url(#inside)" mask="url(#fill-inset)">
    <rect width="512" height="512" fill="#FFFFFF" fill-opacity="0.48" mask="url(#exclude-bowl)"/>
    <g clip-path="url(#bowl-region)">
      <path fill="#FFFFFF" fill-opacity="0.72" d="M0 0 H512 V121 L490 132 L414 168 L394 151 L349 170 H0 Z"/>
      <path fill="#FFFFFF" fill-opacity="0.28" d="M0 170 H349 L394 151 L414 168 L490 132 L512 121 V512 H0 Z"/>
    </g>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-linejoin="round" stroke-linecap="round" mask="url(#open-fractures)">
    <use href="#monogram" stroke-width="44.505967"/>
    <g clip-path="url(#inside)">
      <use href="#fractures" stroke-width="49.052506"/>
    </g>
  </g>
  </g>
  <!-- Custom SVG-only character shapes, with 25% tighter measured inter-letter gaps and a half-width underscore. -->
  <g transform="translate(169.741857 108.810000) scale(0.13000000 -0.13000000)" fill="none" stroke="#FFFFFF" stroke-width="74" stroke-linecap="butt" stroke-linejoin="round">
